# fly.toml app configuration file generated for shinobi-academy-api
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "shinobi-academy-api"
primary_region = "fra"

[build]

[http_service]
  internal_port = 5001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[env]
  PORT = "5001"
  NODE_ENV = "production"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

